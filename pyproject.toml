[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-support-screening-poc"
version = "0.6.0"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "httpx==0.28.1", "pydantic==2.13.5", "Pillow==12.3.0"]

[project.optional-dependencies]
models = ["torch==2.5.1", "torchvision==0.20.1", "timm==0.9.2", "ultralytics==8.4.8", "sahi==0.12.6", "ensemble-boxes==1.0.9", "gdown==6.4.0"]
test = ["pytest==8.4.2", "ruff==0.13.0"]
browser-test = ["playwright==1.57.0"]
modal = ["modal==1.5.5"]

[project.scripts]
dr-support-run = "dr_support.run:main"

[tool.setuptools.packages.find]
include = ["dr_support*"]
[tool.setuptools.package-data]
"dr_support.providers" = ["*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E9", "F"]
