services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DR_SUPPORT_POSTGRES_DB}
      POSTGRES_USER: ${DR_SUPPORT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DR_SUPPORT_POSTGRES_PASSWORD}
    ports:
      - "${DR_SUPPORT_POSTGRES_BIND:-127.0.0.1}:${DR_SUPPORT_POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
    name: ${DR_SUPPORT_POSTGRES_VOLUME}
