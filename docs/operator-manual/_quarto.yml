project:
  type: book
  output-dir: ../../dist/manual/operator-site

book:
  title: "Retinal Review Workbench"
  subtitle: "Deployment and Operations Manual"
  author: "Retinal Review Workbench"
  date: "2026-09-23"
  chapters:
    - index.qmd
    - 01-architecture.qmd
    - 02-installation.qmd
    - 03-model-server.qmd
    - 04-operations.qmd
    - 05-security-backup.qmd
    - 06-upgrade-troubleshooting.qmd

format:
  html:
    theme: default
    css: styles.css
    toc: true
    toc-depth: 2
    number-sections: true
    number-depth: 2
    page-layout: article
    callout-icon: false
  pdf:
    pdf-engine: xelatex
    documentclass: scrreprt
    classoption:
      - open=any
      - numbers=noendperiod
    papersize: a4
    toc: true
    toc-depth: 2
    number-sections: true
    number-depth: 2
    colorlinks: true
    mainfont: Arial
    geometry:
      - top=18mm
      - bottom=18mm
      - left=19mm
      - right=19mm
    include-in-header: ../manual/latex-header.tex
    callout-icon: false

execute:
  freeze: auto

lang: en
