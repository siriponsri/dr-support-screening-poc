<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="400" viewBox="0 0 1060 400" role="img" aria-labelledby="title desc">
  <title id="title">Retinal Review Workbench clinician workflow</title>
  <desc id="desc">Worklist, Confirm Image (milestone 1), Review, optional RETFound and PRISM assistance, Confirm DR Grade (milestone 2), Edit Annotations when needed, Confirm Annotation (milestone 3), then Dataset or next case.</desc>
  <!-- Generated layout; edit node text here and re-run scripts/manual/render_workflow_asset.py. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f8279"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Liberation Sans", Arial, Helvetica, sans-serif; }
    .step { fill: #ffffff; stroke: #b9c9c0; stroke-width: 2; }
    .optional { fill: #fbfcfb; stroke: #8fa39a; stroke-width: 2; stroke-dasharray: 7 6; }
    .milestone { fill: #205c45; }
    .k { fill: #62716a; font-size: 12.5px; font-weight: 700; letter-spacing: .07em; }
    .k-m { fill: #bfe0cf; font-size: 12.5px; font-weight: 700; letter-spacing: .07em; }
    .t { fill: #1f2b26; font-size: 20px; font-weight: 700; }
    .t-m { fill: #ffffff; font-size: 20px; font-weight: 700; }
    .s { fill: #56655e; font-size: 14.5px; }
    .s-m { fill: #d9ebe1; font-size: 14.5px; }
    .line { stroke: #6f8279; stroke-width: 2.5; fill: none; }
    .dash { stroke: #8fa39a; stroke-width: 2.5; fill: none; stroke-dasharray: 6 6; }
    .legend { fill: #3d4a44; font-size: 14.5px; }
  </style>
  <rect width="1060" height="400" fill="#ffffff"/>
  <g transform="translate(14,24)">
    <rect class="step" width="232" height="112" rx="12"/>
    <text class="k" x="18" y="30">STEP 1</text>
    <text class="t" x="18" y="62">Worklist</text>
    <text class="s" x="18" y="88">Select an admitted image</text>
  </g>
  <g transform="translate(280,24)">
    <rect class="milestone" width="232" height="112" rx="12"/>
    <text class="k-m" x="18" y="30">STEP 2 · MILESTONE 1</text>
    <text class="t-m" x="18" y="62">Confirm Image</text>
    <text class="s-m" x="18" y="88">Patient key, eye, reviewer</text>
  </g>
  <g transform="translate(546,24)">
    <rect class="step" width="232" height="112" rx="12"/>
    <text class="k" x="18" y="30">STEP 3</text>
    <text class="t" x="18" y="62">Review</text>
    <text class="s" x="18" y="88">The image stays primary</text>
  </g>
  <g transform="translate(812,24)">
    <rect class="optional" width="232" height="112" rx="12"/>
    <text class="k" x="18" y="30">STEP 4 · OPTIONAL</text>
    <text class="t" x="18" y="62">AI assistance</text>
    <text class="s" x="18" y="88">RETFound grade · PRISM ROIs</text>
  </g>
  <g transform="translate(14,210)">
    <rect class="milestone" width="232" height="112" rx="12"/>
    <text class="k-m" x="18" y="30">STEP 5 · MILESTONE 2</text>
    <text class="t-m" x="18" y="62">Confirm DR Grade</text>
    <text class="s-m" x="18" y="88">Final clinician grade</text>
  </g>
  <g transform="translate(280,210)">
    <rect class="step" width="232" height="112" rx="12"/>
    <text class="k" x="18" y="30">STEP 6 · WHEN NEEDED</text>
    <text class="t" x="18" y="62">Edit Annotations</text>
    <text class="s" x="18" y="88">Human ROIs · AI ROI edits</text>
  </g>
  <g transform="translate(546,210)">
    <rect class="milestone" width="232" height="112" rx="12"/>
    <text class="k-m" x="18" y="30">STEP 7 · MILESTONE 3</text>
    <text class="t-m" x="18" y="62">Confirm Annotation</text>
    <text class="s-m" x="18" y="88">Active set at this hash</text>
  </g>
  <g transform="translate(812,210)">
    <rect class="step" width="232" height="112" rx="12"/>
    <text class="k" x="18" y="30">STEP 8</text>
    <text class="t" x="18" y="62">Dataset / Next Case</text>
    <text class="s" x="18" y="88">DR-ready · Lesion-ready</text>
  </g>
  <line class="line" x1="246" y1="80.0" x2="276" y2="80.0" marker-end="url(#arrow)"/>
  <line class="line" x1="512" y1="80.0" x2="542" y2="80.0" marker-end="url(#arrow)"/>
  <line class="dash" x1="778" y1="80.0" x2="808" y2="80.0" marker-end="url(#arrow)"/>
  <line class="line" x1="246" y1="266.0" x2="276" y2="266.0" marker-end="url(#arrow)"/>
  <line class="line" x1="512" y1="266.0" x2="542" y2="266.0" marker-end="url(#arrow)"/>
  <line class="line" x1="778" y1="266.0" x2="808" y2="266.0" marker-end="url(#arrow)"/>
  <path class="line" d="M662.0,136 L662.0,173.0 L130.0,173.0 L130.0,206" marker-end="url(#arrow)"/>
  <path class="dash" d="M928.0,136 L928.0,173.0 L668.0,173.0"/>
  <g transform="translate(14,352)">
    <rect class="milestone" width="24" height="17" rx="4"/>
    <text class="legend" x="34" y="14">Case-level confirmation milestone</text>
    <rect class="optional" x="290" width="24" height="17" rx="4"/>
    <text class="legend" x="324" y="14">Optional model assistance</text>
    <text class="legend" x="560" y="14">No per-lesion confirmation queue · human review decides</text>
  </g>
</svg>
