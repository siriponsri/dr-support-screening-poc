<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Retinal Review Workbench clinician workflow</title>
  <desc id="desc">Worklist, Confirm Image, Review with optional model assistance, Confirm DR Grade, optional Edit Annotations, Confirm Annotation, and Datasets.</desc>
  <style>
    .ink { fill: #24312c; font-family: Arial, sans-serif; }
    .muted { fill: #62716a; font-family: Arial, sans-serif; }
    .green { fill: #205c45; }
    .box { fill: #ffffff; stroke: #b8c7be; stroke-width: 2; }
    .milestone { fill: #f3f7f4; stroke: #205c45; stroke-width: 2; }
    .optional { fill: #ffffff; stroke: #b8c7be; stroke-width: 2; stroke-dasharray: 7 5; }
    .arrow { stroke: #7a8981; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7a8981" />
    </marker>
  </defs>
  <rect width="1200" height="360" fill="#ffffff" />
  <text x="48" y="42" class="green" font-size="14" letter-spacing="2">CLINICIAN WORKFLOW</text>
  <text x="48" y="78" class="ink" font-size="27" font-weight="700">From admitted image to reviewed dataset</text>
  <text x="48" y="104" class="muted" font-size="15">Model output is optional evidence. Human review remains authoritative.</text>

  <line x1="194" y1="215" x2="216" y2="215" class="arrow" />
  <line x1="382" y1="215" x2="404" y2="215" class="arrow" />
  <line x1="570" y1="215" x2="592" y2="215" class="arrow" />
  <line x1="758" y1="215" x2="780" y2="215" class="arrow" />
  <line x1="946" y1="215" x2="968" y2="215" class="arrow" />

  <rect x="48" y="145" width="146" height="140" rx="8" class="box" />
  <text x="66" y="176" class="green" font-size="22" font-weight="700">01</text>
  <text x="66" y="207" class="ink" font-size="16" font-weight="700">Worklist</text>
  <text x="66" y="235" class="muted" font-size="13">Select a case</text>
  <text x="66" y="256" class="muted" font-size="13">Review status</text>

  <rect x="216" y="145" width="166" height="140" rx="8" class="milestone" />
  <text x="234" y="176" class="green" font-size="22" font-weight="700">02</text>
  <text x="234" y="207" class="ink" font-size="16" font-weight="700">Confirm Image</text>
  <text x="234" y="235" class="muted" font-size="13">Patient and eye</text>
  <text x="234" y="256" class="muted" font-size="13">Reviewer and context</text>

  <rect x="404" y="145" width="166" height="140" rx="8" class="box" />
  <text x="422" y="176" class="green" font-size="22" font-weight="700">03</text>
  <text x="422" y="207" class="ink" font-size="16" font-weight="700">Review</text>
  <text x="422" y="235" class="muted" font-size="13">Image first</text>
  <text x="422" y="256" class="muted" font-size="13">Optional AI assistance</text>

  <rect x="592" y="145" width="166" height="140" rx="8" class="milestone" />
  <text x="610" y="176" class="green" font-size="22" font-weight="700">04</text>
  <text x="610" y="207" class="ink" font-size="16" font-weight="700">Confirm DR Grade</text>
  <text x="610" y="235" class="muted" font-size="13">Human final grade</text>
  <text x="610" y="256" class="muted" font-size="13">Escalate when needed</text>

  <rect x="780" y="145" width="166" height="140" rx="8" class="optional" />
  <text x="798" y="176" class="green" font-size="22" font-weight="700">05</text>
  <text x="798" y="207" class="ink" font-size="16" font-weight="700">Edit Annotations</text>
  <text x="798" y="235" class="muted" font-size="13">Only when needed</text>
  <text x="798" y="256" class="muted" font-size="13">Human or AI ROI edit</text>

  <rect x="968" y="145" width="184" height="140" rx="8" class="milestone" />
  <text x="986" y="176" class="green" font-size="22" font-weight="700">06</text>
  <text x="986" y="207" class="ink" font-size="16" font-weight="700">Confirm Annotation</text>
  <text x="986" y="235" class="muted" font-size="13">Then check Datasets</text>
  <text x="986" y="256" class="muted" font-size="13">Export when ready</text>

  <line x1="48" y1="316" x2="1152" y2="316" stroke="#dce4df" stroke-width="1" />
  <text x="48" y="341" class="muted" font-size="13">The optional annotation step does not create a mandatory per-lesion confirmation queue.</text>
</svg>
