project:
  type: book
  output-dir: ../../../dist/manual/site

book:
  title: "Retinal Review Workbench"
  subtitle: "Clinician User Manual"
  author: "Retinal Review Workbench maintainers"
  date: "2026-09-23"
  output-file: "Retinal-Review-Workbench"
  chapters:
    - index.qmd
    - 01-overview.qmd
    - 02-workflow.qmd
    - 03-review.qmd
    - 04-confirm-grade.qmd
    - 05-annotations.qmd
    - 06-repeated-review.qmd
    - 07-confirm-annotation.qmd
    - 08-datasets.qmd
    - 09-audit.qmd
    - 10-troubleshooting.qmd

format:
  html:
    theme: default
    css: styles.css
    toc: true
    toc-depth: 2
    number-sections: true
    number-depth: 2
    page-layout: article
    fig-pos: H
    tbl-pos: H
    html-math-method: plain
    callout-icon: false
  pdf:
    pdf-engine: xelatex
    documentclass: report
    classoption:
      - 10pt
      - oneside
    papersize: a4
    toc: true
    toc-depth: 2
    number-sections: true
    number-depth: 2
    colorlinks: true
    linkcolor: rrwink
    urlcolor: rrwgreen
    mainfont: Liberation Sans
    mainfontoptions:
      - Scale=1.02
    monofont: Liberation Mono
    monofontoptions:
      - Scale=0.92
    geometry:
      - top=25mm
      - bottom=24mm
      - left=25mm
      - right=25mm
      - headsep=7mm
      - footskip=10mm
    fig-pos: H
    include-in-header: latex-header.tex
    callout-icon: false
    keep-tex: false

crossref:
  chapters: false
  fig-title: "Figure"
  tbl-title: "Table"

execute:
  freeze: auto

lang: en
